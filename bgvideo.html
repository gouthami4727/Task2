<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body,html{
            padding: 0%;
            margin: 0%;
            overflow:hidden;
            height: 100%;
        }
        .bg-video{
            position: fixed;
            top:0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
        }
        .content{
            position: relative;
            color: white;
            text-align:center;
            z-index: 1;
            padding-top:50px ;
        }
        .button{
            padding: 12px 24px;
            background-color: rgb(35, 36, 36);
            color:white;
            border: none;
            font-size:1rem;
            margin-top: 15px;
            cursor:pointer;
        }
        h1 {
            font-size: 3rem;
            text-shadow: 2px 2px 5px rgba(251, 246, 246, 0.7);
            color: black;
        }

        p {
            font-size: 1.5rem;
            text-shadow: 1px 1px 3px rgba(244, 236, 236, 0.7);
            color: black;
        }
    </style>
    <title>bgvideo</title>
</head>
<body>
    <video id="bgvideo" class="bg-video" autoplay muted loop>
    <source src="nature.mp4" type="video/mp4">
    Your browser does not support the video tag.
</video>

    <div class="content">
        <h1>Nature</h1>
        <p>Enjoy our video on background website.</p>
        <button class="button" onclick="toggleVideo()">Pause/Play Video</button>
    </div>
    <script>
        function toggleVideo(){
            var video=document.getElementById('bgvideo');
            if(video.paused){
                video.play();
            } else{
                video.pause();
            }
        }
    </script>
    
</body>
</html>
